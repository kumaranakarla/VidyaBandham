<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vidya Bandham</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Social share preview (WhatsApp, Facebook, etc.) — set explicitly so
       the link card always shows our own title/description/image instead
       of whatever a crawler happens to guess from the page. -->
  <meta name="description" content="Vidya Bandham — school diary, attendance, homework & fees, all in one place.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vidyabandham.com/">
  <meta property="og:title" content="Vidya Bandham">
  <meta property="og:description" content="School diary, attendance, homework & fees — all in one place.">
  <meta property="og:image" content="https://vidyabandham.com/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Vidya Bandham">
  <meta name="twitter:description" content="School diary, attendance, homework & fees — all in one place.">
  <meta name="twitter:image" content="https://vidyabandham.com/og-image.png">
  <!-- Most devices already have a Telugu-capable font (Windows' Nirmala UI,
       Android/Chrome OS's Noto Sans Telugu, recent macOS), but this makes
       the Telugu TET Prep / Mock Test text render correctly everywhere,
       regardless of what's installed on the visitor's own device/OS. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Razorpay's own checkout widget script — needed for the 2026 (New) tab's
       subscription paywall (see Tet2026Component). Loaded globally here
       rather than npm-installed, per Razorpay's own integration docs. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
